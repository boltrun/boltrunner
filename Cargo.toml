[workspace]
members = ["crates/shared", "crates/server", "crates/client", "crates/game"]
exclude = ["vendor/aeronet_websocket"]
default-members = ["crates/shared", "crates/server", "crates/client"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "serialize", "bevy_state"] }
lightyear = { version = "=0.30.1", default-features = false, features = ["std", "replication", "prediction", "interpolation", "input_native", "websocket", "raw_connection"] }
serde = { version = "1.0.229", features = ["derive"] }
boltrunner-shared = { path = "crates/shared" }
boltrunner-client = { path = "crates/client" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.web]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 16

[patch.crates-io]
aeronet_websocket = { path = "vendor/aeronet_websocket" }
