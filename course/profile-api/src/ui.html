<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Boltrunner — профиль игрока</title><style>body{font:16px/1.55 system-ui;background:#10202e;color:#edf4fa;max-width:820px;margin:50px auto;padding:0 22px}h1{font-size:36px;margin-bottom:4px}header p{color:#a7bac9}section{background:#1b3040;border:1px solid #375367;padding:24px;border-radius:16px;margin:22px 0}label{display:block;margin:14px 0 5px}input,select,button{font:inherit;border-radius:7px;padding:10px;border:1px solid #56778e}input,select{box-sizing:border-box;width:100%;background:#10202e;color:white}button{background:#5ed6b5;color:#0c2825;cursor:pointer;margin:18px 10px 0 0}button.secondary{background:#cfdae4;color:#122433}.message{min-height:24px;color:#ffd4a8}a{color:#7ae1ce}[hidden]{display:none}.row{display:flex;gap:16px}.row>div{flex:1}.card{background:#10202e;border:1px solid #4b6779;padding:20px;border-radius:10px}.status{color:#7ae1ce}</style><header><p>BOLTRUNNER / PLAYER PROFILE</p><h1>Профиль игрока</h1><p>Вход, выбор персонажа и настройка профиля</p></header><main><section id="loginScreen"><h2>Вход в аккаунт</h2><label for="nickname">Ник</label><input id="nickname" maxlength="20" autocomplete="username"><label for="password">Пароль</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password"><button id="login">Войти</button><button id="register" class="secondary">Создать аккаунт</button><p class="message" id="loginMessage" role="status"></p></section><section id="profileScreen" hidden><p class="status">Вы вошли в аккаунт</p><h2>Настройки профиля</h2><label for="editName">Ник</label><input id="editName" maxlength="20"><div class="row"><div><label for="color">Цвет игрока</label><select id="color"><option value="0">Голубой</option><option value="1">Красный</option><option value="2">Зелёный</option><option value="3">Жёлтый</option><option value="4">Фиолетовый</option><option value="5">Оранжевый</option><option value="6">Розовый</option><option value="7">Белый</option></select></div><div><label for="character">Персонаж</label><select id="character"><option value="default">Стандартный</option><option value="keqing">Кэ Цин</option><option value="sonic">Соник</option><option value="cheburashka">Чебурашка</option></select></div></div><button id="save">Сохранить</button><button id="logout" class="secondary">Выйти</button><p class="message" id="profileMessage" role="status"></p></section><section id="resultScreen" hidden><h2>Профиль сохранён</h2><div class="card" id="result"></div><button id="edit" class="secondary">Изменить профиль</button></section></main><p><a href="/docs">Swagger UI</a> · <a href="/openapi.json">OpenAPI JSON</a></p><script>
let token=null;const $=id=>document.getElementById(id);function show(id){['loginScreen','profileScreen','resultScreen'].forEach(x=>$(x).hidden=x!==id)}
async function request(path,method='GET',data){let r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(data?{body:JSON.stringify(data)}:{})});let body=r.status===204?null:await r.json();if(!r.ok){if(r.status===401&&token){token=null;show('loginScreen')}throw Error(body.error||'Ошибка '+r.status)}return body;}
async function enter(){let v=await request('/api/login','POST',{nickname:$('nickname').value,password:$('password').value});token=v.access_token;$('password').value='';let u=await request('/api/users/me');$('editName').value=u.nickname;$('color').value=u.color;$('character').value=u.character;show('profileScreen');}
$('login').onclick=async()=>{try{await enter();$('loginMessage').textContent=''}catch(e){$('loginMessage').textContent=e.message}};
$('register').onclick=async()=>{try{await request('/api/register','POST',{nickname:$('nickname').value,password:$('password').value,color:0,character:'default'});await enter()}catch(e){$('loginMessage').textContent=e.message}};
$('save').onclick=async()=>{try{let u=await request('/api/users/me','PUT',{nickname:$('editName').value,color:Number($('color').value),character:$('character').value});$('result').textContent=`Игрок: ${u.nickname} · ID: ${u.id} · Персонаж: ${$('character').selectedOptions[0].textContent} · Цвет: ${$('color').selectedOptions[0].textContent}`;show('resultScreen')}catch(e){$('profileMessage').textContent=e.message}};
$('edit').onclick=()=>show('profileScreen');$('logout').onclick=()=>{token=null;show('loginScreen')};
</script></html>
